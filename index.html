<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도서관 책 챙기기</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도서관">
<meta name="theme-color" content="#1f6b55">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 한 줄 목록: 맨 앞 체크, 청구기호(한 줄) 위, 제목 아래. 서가 순서대로 위에서부터 빌린다 */
:root{--bg:#f4f6f4;--card:#fff;--ink:#16241f;--sub:#66756f;--line:#dfe6e2;--accent:#1f6b55;--soft:#dcefe7;--ok:#1f8a58;--hold:#a15c00;--holdbg:#fbefdc;--read:#4a5a9c;--readbg:#e8ebf7;--y:#e9b949;
--sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a17;--card:#18262a;--ink:#e7f0ec;--sub:#97aaa3;--line:#2a3f3a;--accent:#56c5a7;--soft:#1c3a33;--ok:#58c98f;--hold:#f0b45c;--holdbg:#3a2c16;--read:#a7b4ef;--readbg:#232a45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a17;--card:#18262a;--ink:#e7f0ec;--sub:#97aaa3;--line:#2a3f3a;--accent:#56c5a7;--soft:#1c3a33;--ok:#58c98f;--hold:#f0b45c;--holdbg:#3a2c16;--read:#a7b4ef;--readbg:#232a45;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:19px;margin:0;font-weight:900;letter-spacing:-.02em}
.stamp{margin:2px 0 0;color:var(--sub);font-size:12.5px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px;display:grid;gap:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{font:inherit;font-weight:700;font-size:14px;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button small{font-weight:500;color:var(--sub);margin-left:3px;font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button[aria-selected="true"] small{color:#fff;opacity:.85}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip small{color:var(--sub);margin-left:3px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.lang{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lang button{font:inherit;font-weight:800;font-size:14px;padding:9px 0;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.lang small{font-weight:500;color:var(--sub);margin-left:4px;font-size:12px}
.tg.gosu{background:#fde4ea;color:#111}
.sub{display:flex;gap:6px}
.sub button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:9px;cursor:pointer}
.sub button[aria-pressed="true"]{background:var(--readbg);border-color:var(--read);color:var(--read)}
.q{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px}
.shelf.gs{color:#8a5d00}
.shelf{margin:16px 0 6px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.shelf span{font-weight:400;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:6px 10px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);margin:1px 0 0}
.h{display:flex;align-items:center;gap:6px;justify-content:space-between}
.call{flex:1;min-width:0;font-family:var(--mono);font-weight:700;font-size:18px;line-height:1.15;white-space:nowrap;overflow-x:auto;scrollbar-width:none;letter-spacing:-.01em;color:var(--accent)}
.call::-webkit-scrollbar{display:none}
.tl{margin-top:1px;font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.cp{font:inherit;font-size:10px;font-weight:500;line-height:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:5px;padding:3px 6px;cursor:pointer;margin-left:6px;vertical-align:2px;white-space:nowrap}
.cp.on{color:var(--ok);border-color:var(--ok)}
.meta{font-size:13px;line-height:1.3;color:var(--sub);margin-top:1px}
.lv{font-weight:700;color:var(--ink)}
.dotj{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2e8b57;margin-left:6px;vertical-align:1px}
.tg{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--accent);margin-left:4px}
.tg.tb{background:#fde4ea;color:#111}
.acts{display:flex;gap:4px;flex:none}
.acts a,.acts button{font:inherit;font-size:11.5px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:3px 7px;min-height:0;line-height:1.2;display:inline-flex;align-items:center;cursor:pointer}
.acts .rd{color:var(--read);border-color:var(--read)}
.acts .hd{color:var(--hold);border-color:var(--hold)}
li.got .call,li.got .tl{color:var(--sub);text-decoration:line-through}
li.got{background:var(--soft)}
.acts .br{color:var(--accent);border-color:var(--accent)}
.ex{margin:10px 0 4px}
.hb{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}.hb summary{font-weight:700;color:var(--sub);cursor:pointer;padding:6px 0}
.bb{margin-left:auto;font:inherit;font-weight:800;font-size:16px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 22px;cursor:pointer}.bb:disabled{opacity:.35}
.off{opacity:.5}.off .tl{text-decoration:line-through}
.empty{padding:26px;text-align:center;color:var(--sub)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:9}
.dock div{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px}
.track{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent)}
.dock b{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.rs{font:inherit;font-size:12.5px;color:var(--sub);background:none;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;z-index:20}
.how{margin:10px 0 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px}
.how summary{font-weight:700;cursor:pointer}
.how p{margin:6px 0 0}
.note{font-size:12px;color:var(--sub);margin-top:20px;line-height:1.65}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>

const ST_KEY="gd-state-v2";
let lang="ko";
const ALL=()=>lang==="ko"?BOOKS:EBOOKS;
let S={pick:{},hold:{},read:{},borrow:{}};
try{const r=JSON.parse(localStorage.getItem(ST_KEY)||"null");if(r)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem(ST_KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=b=>b.c+"|"+b.t;
const isRY=b=>{const v=S.read[key(b)];return v===undefined?!!b.y:v===1};
const isBor=b=>!!S.borrow[key(b)];
const KDC=["총류","철학","종교","사회과학","자연과학","기술과학","예술","언어","문학","역사"];
const PRE=["J","C","CB","BET","CH","WDS","AU","GR","SB","LIL","NF","FAV"];
const num=b=>{const m=b.c.match(/(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):-1};
const cls=b=>{const n=num(b);return n<0?-1:Math.min(9,Math.floor(n/100))};
const pre=b=>{const m=b.c.match(/^([A-Z]+)\s/);const i=m?PRE.indexOf(m[1]):-1;return i<0?99:i};
const cmp=(a,b)=>pre(a)-pre(b)||num(a)-num(b)||a.c.localeCompare(b.c,"ko",{numeric:true});
function searchUrl(t){const q=t.split(/[:：]/)[0].replace(/\(.*?\)/g," ").trim();
  if(lang==="en")return "https://www.splib.or.kr/spelib/program/plusSearchResultList.do?searchType=SIMPLE&searchCategory=BOOK&searchKey=ALL&searchKeyword="+encodeURIComponent(q)+"&searchLibraryArr=MD&searchSort=SIMILAR&searchOrder=DESC&searchRecordCount=10&currentPageNo=1&viewStatus=LIST";
  return "https://www.gdlibrary.or.kr/portal/menu/38/book/search/collection?searchType=normal&tabSearch=false&form_code=&media_code=&doc_type=&sortField=score&sortOrder=desc&display=10&searchInput="+encodeURIComponent(q)+"&title=&author=&publisher=&isbn=&keyword=&pub_year_from=&pub_year_to=&lib_type=&manage_code=MH&smart_manage_code=&small_manage_code=";}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function copy(text,btn){
  const done=ok=>{toast(ok?"복사했어요":"복사가 안 돼요. 제목을 길게 눌러 복사하세요");if(ok&&btn){btn.classList.add("on");setTimeout(()=>btn.classList.remove("on"),1200)}};
  const fb=()=>{try{const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();done(ok)}catch(e){done(false)}};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>done(true),fb)}else fb()}catch(e){fb()}
}
function row(b,mode){
  const k=key(b),got=mode==="list"&&!!S.pick[k];
  const acts=mode==="list"?`<a href="${searchUrl(b.t)}" target="_blank" rel="noopener">검색</a>`:`<button type="button" data-a="unborrow">취소</button>`;
  return `<li class="${got?"got":""}" data-k="${esc(k)}"><input type="checkbox" aria-label="체크" ${got?"checked":""}${mode==="list"?"":" hidden"}><div><div class="h"><div class="call">${esc(b.c)}</div><div class="acts">${acts}</div></div><div class="tl">${esc(b.t)}<button type="button" class="cp" data-a="copy">복사</button></div><div class="meta">${esc(b.a)}${b.a&&b.p?" · ":""}${esc(b.p)}</div></div></li>`;
}
function count(){
  const n=[...BOOKS,...EBOOKS].filter(b=>S.pick[key(b)]&&!isBor(b)&&!isRY(b)).length;
  $("cnt").textContent=n+"권 체크";$("bb").disabled=!n;
}
function render(){
  const list=ALL().filter(b=>!isRY(b)&&!isBor(b)).sort(cmp);
  const by={};list.forEach(b=>{(by[cls(b)]=by[cls(b)]||[]).push(b)});
  let h="";
  for(const c of Object.keys(by).map(Number).sort((a,b)=>a-b)){
    const nm=c<0?"기타":(c*100)+" "+KDC[c];
    h+=`<div class="shelf">${nm}<span>${by[c].length}권</span></div><ul>${by[c].map(b=>row(b,"list")).join("")}</ul>`;
  }
  $("out").innerHTML=h||'<div class="empty">빌릴 책이 없어요</div>';
  const bl=[...BOOKS,...EBOOKS].filter(b=>isBor(b)&&!isRY(b)).sort((a,b)=>S.borrow[key(b)]<S.borrow[key(a)]?-1:1);
  $("bor").innerHTML=bl.length?`<details class="hb"><summary>빌린 책 ${bl.length}권</summary><button type="button" class="ex" data-x="exp">시트에 넣을 목록 복사</button><ul>${bl.map(b=>row(b,"bor")).join("")}</ul></details>`:"";
  $("lang").innerHTML=[["ko","중앙"],["en","송파영어"]].map(([id,n])=>`<button type="button" data-l="${id}" aria-pressed="${lang===id}">${n}</button>`).join("");
  count();
}
document.addEventListener("click",e=>{
  const lg=e.target.closest("[data-l]");if(lg){lang=lg.dataset.l;render();scrollTo(0,0);return}
  const x=e.target.closest("[data-x]");if(x){const rows=[];[["한글",BOOKS],["영어",EBOOKS]].forEach(([n,arr])=>arr.forEach(b=>{if(isBor(b)&&!isRY(b))rows.push(S.borrow[key(b)]+"\t"+n+"\t"+b.c+"\t"+b.t)}));copy(rows.join("\n"),x);return}
  const li=e.target.closest("li[data-k]");if(!li)return;
  const k=li.dataset.k,b=[...BOOKS,...EBOOKS].find(y=>key(y)===k),a=e.target.closest("[data-a]");
  if(e.target.matches("input[type=checkbox]")){if(e.target.checked){S.pick[k]=1;li.classList.add("got")}else{delete S.pick[k];li.classList.remove("got")}save();count();return}
  if(!a)return;
  if(a.dataset.a==="copy"){copy(b.t,a);return}
  if(a.dataset.a==="unborrow"){delete S.borrow[k];save();render()}
});
$("bb").addEventListener("click",()=>{
  const d=new Date().toISOString().slice(0,10);let n=0;
  [...BOOKS,...EBOOKS].forEach(b=>{const k=key(b);if(S.pick[k]&&!isBor(b)&&!isRY(b)){S.borrow[k]=d;n++}delete S.pick[k]});
  save();render();toast(n+"권 빌림으로 옮겼어요");
});
$("stamp").textContent=CHECKED+" 확인 · 청구기호 순";
render();
</script>
